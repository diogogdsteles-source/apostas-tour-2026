<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apostas · Tour de France 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --y:#F5C518;--yd:#B8890A;
  --bg:#fff;--bg2:#f6f5f2;--bg3:#eeede9;
  --bd:rgba(0,0,0,0.11);--bd2:rgba(0,0,0,0.22);
  --t:#1a1a18;--t2:#6b6b67;--t3:#9a9a94;
  --gbg:#EAF3DE;--gbd:#97C459;--gt:#3B6D11;--gdk:#27500A;
  --abg:#FAEEDA;--abd:#FAC775;--at:#BA7517;--adk:#633806;
  --bbg:#E6F1FB;--bbd:#85B7EB;--bt:#0C447C;
  --rbg:#FCEBEB;--rbd:#F09595;--rt:#A32D2D;
  --rad:8px;--radl:12px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;
  --bd:rgba(255,255,255,0.11);--bd2:rgba(255,255,255,0.22);
  --t:#f0f0ec;--t2:#9a9a94;--t3:#6b6b67;
  --gbg:#173404;--gbd:#3B6D11;--gt:#C0DD97;--gdk:#EAF3DE;
  --abg:#412402;--abd:#854F0B;--at:#FAC775;--adk:#FAEEDA;
  --bbg:#042C53;--bbd:#185FA5;--bt:#B5D4F4;
  --rbg:#501313;--rbd:#A32D2D;--rt:#F7C1C1;
}}
body{font-family:var(--font);background:var(--bg2);color:var(--t);min-height:100vh;font-size:15px;line-height:1.5}
.page{max-width:680px;margin:0 auto;padding:1.5rem 1rem 5rem}

/* Header */
.hdr{display:flex;align-items:center;gap:14px;margin-bottom:1.5rem}
.hdr-icon{background:var(--y);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}

/* Tabs */
.tabs{display:flex;margin-bottom:1.5rem;border-bottom:1px solid var(--bd);overflow-x:auto}
.tab{padding:10px 16px;font-size:13px;font-weight:700;border:none;background:none;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--font);transition:color .15s;display:flex;align-items:center;gap:6px}
.tab.on{color:var(--t);border-bottom-color:var(--yd)}
.tab:hover:not(.on){color:var(--t)}
.tab .bdg{background:var(--at);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px}
.panel{display:none}.panel.on{display:block}

/* Mountain leaderboard */
.mtn-card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--radl);overflow:hidden;margin-bottom:1rem}
.lb-list{padding:.75rem}
.lb-row{display:grid;grid-template-columns:32px 36px 1fr auto;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rad);margin-bottom:5px;border:1px solid var(--bd);background:var(--bg2)}
.lb-row.gold{background:var(--abg);border-color:var(--abd)}
.lb-row.sil,.lb-row.bro{background:var(--bg3)}
.prog-bg{background:var(--bd);border-radius:99px;height:4px;margin-top:5px;overflow:hidden}
.prog-fill{height:4px;border-radius:99px;background:var(--y)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:5px;vertical-align:middle}
.chip-ok{background:var(--gbg);color:var(--gt)}.chip-used{background:var(--bg3);color:var(--t2)}

/* Wizard (apostas) */
.wiz{background:var(--bg);border:1px solid var(--bd);border-radius:var(--radl);overflow:hidden}
.wiz-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--bd)}
.wdot{flex:1;padding:10px 5px;text-align:center;font-size:11px;font-weight:700;color:var(--t2);border-right:1px solid var(--bd)}
.wdot:last-child{border-right:none}
.wdot.cur{color:var(--yd);border-bottom:2px solid var(--yd)}
.wdot.done{color:var(--gt)}
.wbody{padding:1.375rem}
.wtitle{font-size:16px;font-weight:800;margin-bottom:3px}
.wsub{font-size:13px;color:var(--t2);margin-bottom:1.125rem}

/* Stage grid */
.sg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:6px;margin-bottom:1rem}
.sg{border:1px solid var(--bd);border-radius:var(--rad);padding:9px 10px 7px;cursor:pointer;background:var(--bg);transition:border-color .12s}
.sg:hover:not(.sg-off){border-color:var(--yd)}
.sg.sg-on{border-color:var(--yd);background:var(--abg)}
.sg.sg-off{opacity:.35;cursor:not-allowed;pointer-events:none}
.sg-n{font-size:13px;font-weight:700;margin-bottom:1px}
.sg-r{font-size:11px;color:var(--t2);line-height:1.35}
.sg.sg-on .sg-r{color:var(--at)}
.spill{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:4px}
.sp-o{background:var(--bbg);color:var(--bt)}
.sp-w{background:var(--abg);color:var(--at)}
.sp-d{background:var(--gbg);color:var(--gt)}

/* Player bet cards */
.p-card{border:1px solid var(--bd);border-radius:var(--radl);padding:1rem 1.125rem;margin-bottom:.75rem;background:var(--bg)}
.p-card.locked{border-color:var(--gbd);background:var(--gbg)}
.p-hdr{display:flex;align-items:center;gap:10px;margin-bottom:.625rem}
.p-inputs{display:grid;grid-template-columns:1fr 86px;gap:8px}
.fg label{font-size:12px;color:var(--t2);display:block;margin-bottom:4px;font-weight:700}
.fg input{width:100%;border:1px solid var(--bd2);border-radius:var(--rad);padding:8px 10px;font-size:13px;background:var(--bg);color:var(--t);font-family:var(--font)}
.fg input:focus{outline:none;border-color:var(--yd)}
.fg input:disabled{opacity:.4;cursor:not-allowed}
.jklbl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);margin-top:9px;cursor:pointer}
.jklbl input{accent-color:var(--yd)}
.lock-badge{font-size:11px;background:var(--gbg);color:var(--gt);padding:3px 9px;border-radius:99px;font-weight:700;white-space:nowrap}

/* Resultado tab */
.res-stage-hdr{background:var(--bg);border:1px solid var(--abd);border-radius:var(--radl);padding:1.125rem;margin-bottom:1rem}
.bets-preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:5px;margin-top:.75rem}
.bp{background:var(--bg2);border:1px solid var(--abd);border-radius:var(--rad);padding:7px 9px}
.bp-n{font-size:11px;color:var(--at);font-weight:700;margin-bottom:1px}
.bp-cy{font-size:13px;font-weight:700;color:var(--adk)}

/* Winner input */
.winner-input-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:1.25rem;flex-wrap:wrap}
.winner-input-row .fg{flex:1;min-width:160px}
.winner-set{background:var(--gbg);border:1px solid var(--gbd);border-radius:var(--radl);padding:1rem 1.125rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:12px}
.winner-set-name{font-size:18px;font-weight:800;color:var(--gdk)}

/* Position entry rows */
.pos-entry{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.pos-entry:last-child{border-bottom:none}
.pos-input{width:70px;border:1px solid var(--bd2);border-radius:var(--rad);padding:8px 10px;font-size:15px;font-weight:700;text-align:center;background:var(--bg);color:var(--t);font-family:var(--font)}
.pos-input:focus{outline:none;border-color:var(--yd)}
.win-badge{font-size:13px;background:var(--gbg);color:var(--gt);padding:6px 14px;border-radius:99px;font-weight:700}
.pts-preview{font-size:13px;font-weight:700;min-width:60px;text-align:right}

/* Confirm table */
.ct{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:1rem}
.ct th{text-align:left;font-size:12px;font-weight:700;color:var(--t2);padding:6px 8px;border-bottom:1px solid var(--bd)}
.ct td{padding:8px 8px;border-bottom:1px solid var(--bd)}
.ct tr:last-child td{border-bottom:none}
.ct .wrow td{background:var(--gbg);color:var(--gdk);font-weight:700}

/* History */
.bet-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:4px;margin-bottom:1.25rem}
.bc{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rad);padding:8px 10px}
.bc.bw{background:var(--gbg);border-color:var(--gbd)}
.bc-pn{font-size:11px;color:var(--t2);margin-bottom:2px;font-weight:700}
.bc-cy{font-size:13px;font-weight:700}
.bc-pt{font-size:12px;margin-top:3px}
.bc.bw .bc-pt{color:var(--gt);font-weight:700}
.type-pill{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--bg2);border:1px solid var(--bd);color:var(--t2)}
.seclab{font-size:13px;font-weight:700;color:var(--t2);margin-bottom:8px}

/* Config */
.card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--radl);padding:1.25rem;margin-bottom:.875rem}
.card-title{font-size:15px;font-weight:700;margin-bottom:.75rem}
.pl-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.pl-row input{flex:1;border:1px solid var(--bd2);border-radius:var(--rad);padding:8px 10px;font-size:13px;background:var(--bg);color:var(--t);font-family:var(--font)}
.pl-row select{border:1px solid var(--bd2);border-radius:var(--rad);padding:8px;font-size:18px;background:var(--bg);color:var(--t);font-family:var(--font);cursor:pointer}

/* Misc */
.warn{background:var(--abg);border:1px solid var(--abd);border-radius:var(--rad);padding:10px 13px;font-size:13px;color:var(--adk);margin-bottom:1rem;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--t2)}
.empty-state .big{font-size:3rem;margin-bottom:.5rem}
hr.dv{border:none;border-top:1px solid var(--bd);margin:1.25rem 0}

/* Buttons */
.nav{display:flex;gap:8px;margin-top:1rem;align-items:center;flex-wrap:wrap}
.btn{border-radius:var(--rad);padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;gap:6px;transition:opacity .15s}
.btn:hover{opacity:.82}.btn:disabled{opacity:.32;cursor:not-allowed}
.bty{background:var(--y);color:#2C2C2A;border:none}
.btg{background:var(--gt);color:#fff;border:none}
.btgh{background:none;border:1px solid var(--bd2);color:var(--t)}
.btgh:hover{background:var(--bg2);opacity:1}
.btsm{padding:6px 12px;font-size:12px}
.btdanger{background:var(--rbg);color:var(--rt);border:1px solid var(--rbd)}
</style>
</head>
<body>
<div class="page">

<div class="hdr">
  <div class="hdr-icon">🏆</div>
  <div>
    <div style="font-size:20px;font-weight:800">Apostas · Tour de France 2026</div>
    <div style="font-size:13px;color:var(--t2)">4–26 julho · Barcelona → Paris · 21 etapas</div>
  </div>
</div>

<div class="tabs">
  <button class="tab on"  onclick="go('lb')">🏔 Classificação</button>
  <button class="tab"     onclick="go('add')">✏️ Apostas</button>
  <button class="tab"     onclick="go('res')">🏁 Resultado <span class="bdg" id="res-bdg" style="display:none">!</span></button>
  <button class="tab"     onclick="go('hist')">📋 Histórico</button>
  <button class="tab"     onclick="go('cfg')">⚙️ Config</button>
</div>

<div id="p-lb"   class="panel on"></div>
<div id="p-add"  class="panel"></div>
<div id="p-res"  class="panel"></div>
<div id="p-hist" class="panel"></div>
<div id="p-cfg"  class="panel"></div>

</div>
<script>
const SI=[
  {n:1,d:'4 jul',r:'Barcelona (TTT)',km:19.7,t:'crono'},
  {n:2,d:'5 jul',r:'Tarragona → Barcelona',km:178,t:'ondulada'},
  {n:3,d:'6 jul',r:'Granollers → Les Angles',km:196,t:'montanha'},
  {n:4,d:'7 jul',r:'Carcassonne → Foix',km:182,t:'ondulada'},
  {n:5,d:'8 jul',r:'Lannemezan → Pau',km:158,t:'plana'},
  {n:6,d:'9 jul',r:'Pau → Gavarnie-Gèdre',km:186,t:'montanha'},
  {n:7,d:'10 jul',r:'Hagetmau → Bordeaux',km:175,t:'plana'},
  {n:8,d:'11 jul',r:'Périgueux → Bergerac',km:182,t:'plana'},
  {n:9,d:'12 jul',r:'Malemort → Ussel',km:185,t:'ondulada'},
  {n:10,d:'14 jul',r:'Aurillac → Le Lioran',km:167,t:'montanha'},
  {n:11,d:'15 jul',r:'Vichy → Nevers',km:161,t:'plana'},
  {n:12,d:'16 jul',r:'Magny-Cours → Chalon-sur-Saône',km:181,t:'plana'},
  {n:13,d:'17 jul',r:'Dole → Belfort',km:205,t:'ondulada'},
  {n:14,d:'18 jul',r:'Mulhouse → Le Markstein',km:155,t:'montanha'},
  {n:15,d:'19 jul',r:'Champagnole → Plateau de Solaison',km:184,t:'montanha'},
  {n:16,d:'21 jul',r:'Évian → Thonon-les-Bains (ITT)',km:26,t:'crono'},
  {n:17,d:'22 jul',r:'Chambéry → Voiron',km:175,t:'plana'},
  {n:18,d:'23 jul',r:'Voiron → Orcières-Merlette',km:185,t:'montanha'},
  {n:19,d:'24 jul',r:"Gap → Alpe d'Huez",km:128,t:'montanha'},
  {n:20,d:'25 jul',r:"Le Bourg-d'Oisans → Alpe d'Huez",km:171,t:'montanha'},
  {n:21,d:'26 jul',r:'Thoiry → Paris Champs-Élysées',km:130,t:'plana'},
];
const TI={crono:'⏱',montanha:'⛰',ondulada:'〰',plana:'→'};
const ALL_ICONS=['🚴','🚵','🏅','🎽','⚡','🌟','🦅','🐺','🦁','🐯','🦊','🦋','🏹','🎯','🔥','💎','🌈','🍀'];
const COLORS=['#378ADD','#1D9E75','#D85A30','#D4537E','#7F77DD','#BA7517','#639922'];

const DEF={players:['Pinto','Gonçalo','Diogo','Aléxis','Padeiro'],icons:['🚴','🚵','🏅','🎽','⚡'],stages:[]};
let S=JSON.parse(localStorage.getItem('tdf2026')||'null')||JSON.parse(JSON.stringify(DEF));
if(!S.icons)S.icons=S.players.map((_,i)=>ALL_ICONS[i%ALL_ICONS.length]);
const sv=()=>{try{localStorage.setItem('tdf2026',JSON.stringify(S))}catch(e){}};

const calcPts=(pos,win,joker)=>{let p=win?-50:pos;return joker?p*2:p};
const jkUsed=pl=>S.stages.some(s=>s.jokers&&s.jokers[pl]&&s.status==='done');
const picon=i=>(S.icons&&S.icons[i])||ALL_ICONS[i%ALL_ICONS.length];
const pcolor=i=>COLORS[i%COLORS.length];
const pendingStages=()=>S.stages.filter(s=>s.status==='pending').sort((a,b)=>a.num-b.num);

function getScores(){
  const pts={},wins={};
  S.players.forEach(p=>{pts[p]=0;wins[p]=0});
  S.stages.filter(s=>s.status==='done').forEach(s=>{
    S.players.forEach(p=>{
      const b=s.bets&&s.bets[p],pos=s.positions&&s.positions[p];
      if(!b||pos==null)return;
      const w=b.trim().toLowerCase()===s.winner.trim().toLowerCase();
      pts[p]+=calcPts(pos,w,s.jokers&&s.jokers[p]);
      if(w)wins[p]++;
    });
  });
  return{pts,wins};
}

function updateBadge(){
  const b=document.getElementById('res-bdg');
  if(!b)return;
  const n=pendingStages().length;
  b.style.display=n?'inline':'none';
  b.textContent=n;
}

function go(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['lb','add','res','hist','cfg'][i]===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('p-'+tab).classList.add('on');
  updateBadge();
  ({lb:rLB,add:()=>rWiz(),res:rRes,hist:rHist,cfg:rCfg})[tab]();
}

/* ══════════════════════════════
   MOUNTAIN LEADERBOARD
══════════════════════════════ */
function rLB(){
  const{pts,wins}=getScores();
  const sorted=[...S.players].sort((a,b)=>pts[a]-pts[b]);
  const done=S.stages.filter(s=>s.status==='done').length;
  const pend=pendingStages().length;
  const n=sorted.length;
  const W=680,PAD=52,bY=280,pkX=W/2,pkY=55;

  function rPos(rank){
    const tt=rank/Math.max(n-1,1);
    if(tt<=0.5){const s=tt/0.5;return{x:PAD+(pkX-PAD)*s,y:bY-(bY-pkY)*s}}
    const s=(tt-0.5)/0.5;return{x:pkX+(W-PAD-pkX)*s,y:pkY+(bY-pkY)*s};
  }

  let svg=`<svg width="100%" viewBox="0 0 ${W} 340" role="img" aria-label="Classificação em montanha"><title>Classificação</title><desc>Riders posicionados numa montanha pelos pontos acumulados</desc>`;
  svg+=`<polygon points="${PAD},${bY} ${pkX},${pkY} ${W-PAD},${bY}" fill="#dde8d5" stroke="#9ab88a" stroke-width="1.5"/>`;
  svg+=`<polygon points="${pkX-28},${pkY+36} ${pkX},${pkY-2} ${pkX+28},${pkY+36}" fill="#f2f5f0" stroke="#c0ceba" stroke-width="1"/>`;
  svg+=`<line x1="${PAD}" y1="${bY}" x2="${W-PAD}" y2="${bY}" stroke="#7a9e68" stroke-width="2.5"/>`;
  svg+=`<line x1="${pkX}" y1="${pkY-2}" x2="${pkX}" y2="${pkY-26}" stroke="#c0392b" stroke-width="2"/>`;
  svg+=`<polygon points="${pkX},${pkY-26} ${pkX+15},${pkY-19} ${pkX},${pkY-12}" fill="#c0392b"/>`;

  if(n>1){
    const pts2=sorted.map((_,i)=>{const p=rPos(i);return`${p.x.toFixed(1)},${p.y.toFixed(1)}`}).join(' ');
    svg+=`<polyline points="${pts2}" fill="none" stroke="${done?'#F5C518':'#ccc'}" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>`;
  }

  sorted.forEach((pl,rank)=>{
    const idx=S.players.indexOf(pl);
    const{x,y}=rPos(rank);
    const v=pts[pl];
    const col=pcolor(idx);
    const icon=picon(idx);
    const lead=rank===0&&done>0;
    const r=lead?17:13;
    svg+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r+5}" fill="${col}" opacity="0.15"/>`;
    svg+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${col}" opacity="0.28"/>`;
    svg+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="${lead?16:13}">${icon}</text>`;
    if(lead)svg+=`<text x="${x.toFixed(1)}" y="${(y-r-10).toFixed(1)}" text-anchor="middle" font-size="13">👑</text>`;
    const above=rank%2===0;
    const ly=above?y-r-20:y+r+17;
    const pstr=done?(v>=0?'+':'')+v+' pts':'';
    const lw=Math.max(pl.length*7+12,pstr?pstr.length*6+10:0,46);
    svg+=`<rect x="${(x-lw/2).toFixed(1)}" y="${(ly-13).toFixed(1)}" width="${lw.toFixed(0)}" height="${pstr?27:16}" rx="4" fill="white" opacity="0.92"/>`;
    svg+=`<text x="${x.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${col}">${pl}</text>`;
    if(pstr)svg+=`<text x="${x.toFixed(1)}" y="${(ly+13).toFixed(1)}" text-anchor="middle" font-size="10" fill="${done&&v<0?'#3B6D11':'#cc2200'}">${pstr}</text>`;
  });
  svg+=`<text x="${W/2}" y="318" text-anchor="middle" font-size="12" fill="#888">${done}/21 etapas · ganha quem tiver menos pontos${pend?'  ·  '+pend+' a aguardar resultado':''}</text>`;
  svg+=`</svg>`;

  const medals=['🥇','🥈','🥉'];
  let list='<div class="lb-list">';
  sorted.forEach((pl,i)=>{
    const idx=S.players.indexOf(pl);
    const v=pts[pl];
    const maxV=Math.max(...Object.values(pts).map(Math.abs),1);
    const pct=done?Math.max(4,Math.round(Math.abs(v)/maxV*100)):4;
    const jk=jkUsed(pl);
    list+=`<div class="lb-row ${i===0&&done?'gold':i===1&&done?'sil':i===2&&done?'bro':''}">
      <div style="font-size:18px;text-align:center">${medals[i]||i+1+'.'}</div>
      <div style="font-size:24px;text-align:center">${picon(idx)}</div>
      <div>
        <div style="font-size:14px;font-weight:700">${pl}<span class="chip ${jk?'chip-used':'chip-ok'}">${jk?'🃏 usado':'🃏 disponível'}</span></div>
        <div style="font-size:12px;color:var(--t2)">${wins[pl]} vitória${wins[pl]!==1?'s':''}</div>
        <div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>
      <div style="font-size:22px;font-weight:800;text-align:right;color:${!done?'var(--t2)':v<0?'var(--gt)':v>100?'#E24B4A':'var(--t)'}">${done?(v>=0?'+':'')+v:' —'}</div>
    </div>`;
  });
  list+='</div>';
  document.getElementById('p-lb').innerHTML=`<div class="mtn-card">${svg}${list}</div>`;
}

/* ══════════════════════════════
   APOSTAS WIZARD
══════════════════════════════ */
let W={step:0,stageNum:null,bets:{},jokers:{},locked:{}};

function rWiz(){
  const steps=['1. Etapa','2. Apostas','3. Confirmar'];
  const dots=steps.map((s,i)=>`<div class="wdot ${i===W.step?'cur':i<W.step?'done':''}">${i<W.step?'✓ ':''}${s}</div>`).join('');
  let body='';

  if(W.step===0){
    const used=new Set(S.stages.map(s=>s.num));
    body+=`<div class="wtitle">Escolhe a etapa</div>
    <div class="wsub">As apostas fecham antes de inserir o resultado</div>
    <div class="sg-grid">`;
    SI.forEach(s=>{
      const isUsed=used.has(s.n),isSel=W.stageNum===s.n;
      const sd=S.stages.find(x=>x.num===s.n);
      const pill=sd?(sd.status==='done'?`<span class="spill sp-d">🔒 fechada</span>`:`<span class="spill sp-w">⏳ a aguardar</span>`):`<span class="spill sp-o">aberta</span>`;
      body+=`<div class="sg ${isSel?'sg-on':''} ${isUsed?'sg-off':''}" onclick="wSel(${s.n})">
        <div class="sg-n">${TI[s.t]} Et. ${s.n}</div>
        <div class="sg-r">${s.d} · ${s.km}km</div>${pill}</div>`;
    });
    body+=`</div><div class="nav"><button class="btn bty" onclick="wNext()">Seguinte →</button></div>`;
  }

  else if(W.step===1){
    const info=SI.find(x=>x.n===W.stageNum)||{};
    body+=`<div class="wtitle">Etapa ${W.stageNum} — ${info.r}</div>
    <div class="wsub">${info.d} · ${info.km}km · Cada jogador fecha a sua aposta individualmente</div>`;
    S.players.forEach((p,i)=>{
      const jk=jkUsed(p),lk=!!W.locked[p];
      body+=`<div class="p-card ${lk?'locked':''}">
        <div class="p-hdr">
          <div style="font-size:28px;line-height:1">${picon(i)}</div>
          <div style="flex:1">
            <div style="font-size:14px;font-weight:700">${p}</div>
            <div style="font-size:12px;color:var(--t2)">Joker: ${jk?'<span style="color:var(--t3)">já usado</span>':'disponível'}</div>
          </div>
          ${lk?`<div class="lock-badge">🔒 apostado</div>`:''}
        </div>
        <div class="p-inputs">
          <div class="fg"><label>Ciclista apostado</label>
          <input type="text" id="b${i}" placeholder="Nome" value="${W.bets[p]||''}" ${lk?'disabled':''} oninput="W.bets['${p}']=this.value"></div>
          <div style="display:none"><input id="bp${i}"></div>
        </div>
        ${!jk?`<label class="jklbl"><input type="checkbox" id="bj${i}" ${lk?'disabled':''} ${W.jokers[p]?'checked':''} onchange="W.jokers['${p}']=this.checked"> 🃏 Usar Joker (dobra pontuação)</label>`:''}
        ${!lk?`<div style="margin-top:10px"><button class="btn bty btsm" onclick="wLock(${i},'${p}')">🔒 Fechar aposta de ${p}</button></div>`:''}
      </div>`;
    });
    const allDone=S.players.every(p=>W.locked[p]);
    body+=`<div class="nav">
      <button class="btn btgh" onclick="wBack()">← Voltar</button>
      <button class="btn bty" onclick="wNext()" ${!allDone?'disabled':''}>Rever →</button>
      ${!allDone?`<span style="font-size:12px;color:var(--t2)">Fecha todas as apostas primeiro</span>`:''}
    </div>`;
  }

  else if(W.step===2){
    const info=SI.find(x=>x.n===W.stageNum)||{};
    body+=`<div class="wtitle">Confirmar apostas — Et. ${W.stageNum}</div>
    <div class="wsub">Revê antes de fechar — não se pode alterar depois</div>
    <div class="warn">⚠️ <span>Ao guardar, as apostas ficam <strong>permanentemente fechadas</strong>.</span></div>
    <table class="ct"><tr><th>Jogador</th><th>Aposta</th><th>Joker</th></tr>`;
    S.players.forEach((p,i)=>{
      body+=`<tr><td style="font-weight:700">${picon(i)} ${p}</td><td>${W.bets[p]||'—'}</td><td>${W.jokers[p]?'🃏 sim':'—'}</td></tr>`;
    });
    body+=`</table>
    <div style="background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rad);padding:10px 13px;font-size:13px;color:var(--t2);margin-bottom:1rem">
      Etapa ${W.stageNum} · ${info.r} · ${info.d}</div>
    <div class="nav">
      <button class="btn btgh" onclick="wBack()">← Voltar</button>
      <button class="btn btg" onclick="wSave()">💾 Guardar apostas</button>
    </div>`;
  }

  document.getElementById('p-add').innerHTML=`<div class="wiz"><div class="wiz-bar">${dots}</div><div class="wbody">${body}</div></div>`;
}

function wSel(n){if(S.stages.find(s=>s.num===n))return;W.stageNum=n;rWiz()}
function wLock(i,p){
  const b=document.getElementById('b'+i)?.value.trim();
  if(!b){alert('Indica o ciclista apostado por '+p+'.');return}
  W.bets[p]=b;
  const jk=document.getElementById('bj'+i);if(jk)W.jokers[p]=jk.checked;
  W.locked[p]=true;rWiz();
}
function wNext(){
  if(W.step===0&&!W.stageNum){alert('Escolhe uma etapa.');return}
  if(W.step===1&&!S.players.every(p=>W.locked[p])){alert('Fecha todas as apostas.');return}
  W.step++;rWiz();
}
function wBack(){W.step--;rWiz()}
function wSave(){
  S.stages=S.stages.filter(s=>s.num!==W.stageNum);
  S.stages.push({num:W.stageNum,status:'pending',bets:{...W.bets},jokers:{...W.jokers},positions:{},winner:null});
  S.stages.sort((a,b)=>a.num-b.num);sv();
  W={step:0,stageNum:null,bets:{},jokers:{},locked:{}};
  updateBadge();go('res');
}

/* ══════════════════════════════
   RESULTADO TAB
══════════════════════════════ */
// transient UI state — winner typed but not confirmed yet
let RW=''; // winner string being edited

function rRes(){
  const pend=pendingStages();
  const el=document.getElementById('p-res');

  if(!pend.length){
    const betDone=new Set(S.stages.map(s=>s.num));
    const next=SI.find(s=>!betDone.has(s.n));
    el.innerHTML=`<div class="empty-state">
      <div class="big">🏁</div>
      ${next
        ?`<div style="font-size:15px;font-weight:700;margin-bottom:.5rem">Nenhuma etapa a aguardar resultado</div>
           <div style="font-size:13px;color:var(--t2);margin-bottom:1rem">Próxima a apostar: Et. ${next.n} — ${next.r}</div>
           <button class="btn bty" onclick="go('add')">✏️ Registar apostas da Et. ${next.n}</button>`
        :`<div style="font-size:15px;font-weight:700">Tour concluído! 🎉</div>`
      }</div>`;
    return;
  }

  const s=pend[0];
  const info=SI.find(x=>x.n===s.num)||{};

  // figure out if winner is already confirmed on the stage object (shouldn't be, but guard)
  const confirmedWinner=s._winner||'';

  let h='';

  // queue notice
  if(pend.length>1){
    h+=`<div style="background:var(--abg);border:1px solid var(--abd);border-radius:var(--rad);padding:8px 13px;font-size:13px;color:var(--at);margin-bottom:.875rem">
      ⏳ ${pend.length} etapas a aguardar resultado — a tratar a Et. ${s.num} primeiro
    </div>`;
  }

  // Stage header + bets preview
  h+=`<div class="res-stage-hdr">
    <div style="font-size:18px;font-weight:800;margin-bottom:3px">🏁 Etapa ${s.num} — ${info.r}</div>
    <div style="font-size:13px;color:var(--at);margin-bottom:1rem">${info.d} · ${info.km}km · ${TI[info.t]} ${info.t}</div>
    <div style="font-size:12px;font-weight:700;color:var(--t2);margin-bottom:.5rem">Apostas fechadas:</div>
    <div class="bets-preview">`;
  S.players.forEach((p,i)=>{
    const b=s.bets&&s.bets[p];
    h+=`<div class="bp"><div class="bp-n">${picon(i)} ${p}${s.jokers&&s.jokers[p]?' 🃏':''}</div><div class="bp-cy">${b||'—'}</div></div>`;
  });
  h+=`</div></div>`;

  // ── STEP 1: enter winner ──
  h+=`<div style="margin-bottom:1.5rem">
    <div style="font-size:15px;font-weight:700;margin-bottom:.75rem">1. Quem ganhou a etapa?</div>
    <div class="winner-input-row">
      <div class="fg">
        <label>Nome do vencedor da etapa ${s.num}</label>
        <input type="text" id="winner-inp" placeholder="Ex: Pogacar" value="${RW}" oninput="RW=this.value;updatePosPreview()">
      </div>
    </div>
  </div>`;

  // ── STEP 2: positions ──
  h+=`<div style="margin-bottom:1.5rem">
    <div style="font-size:15px;font-weight:700;margin-bottom:.25rem">2. Posição de cada ciclista apostado</div>
    <div style="font-size:13px;color:var(--t2);margin-bottom:.875rem">Se o ciclista apostado ganhou a etapa, a posição é automaticamente 1</div>
    <div id="pos-entries">`;
  S.players.forEach((p,i)=>{
    const b=s.bets&&s.bets[p];
    const jk=s.jokers&&s.jokers[p];
    // check if this player's bet matches current winner input
    const isWin=RW.trim()&&b&&b.trim().toLowerCase()===RW.trim().toLowerCase();
    const ptv=isWin?calcPts(1,true,jk):null;
    h+=`<div class="pos-entry" id="pe${i}">
      <div style="font-size:24px">${picon(i)}</div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:700">${p}${jk?' 🃏':''}</div>
        <div style="font-size:12px;color:var(--t2)">Apostou: <strong>${b||'—'}</strong></div>
      </div>
      ${isWin
        ?`<span class="win-badge">🏆 pos. 1</span>
          <span class="pts-preview" style="color:var(--gt)">${ptv} pts</span>`
        :`<input type="number" class="pos-input" id="pos${i}" min="1" max="200" placeholder="Pos." oninput="updatePts(${i})"
            value="${s._positions&&s._positions[p]||''}">
          <span class="pts-preview" id="pts${i}" style="color:var(--t2)">— pts</span>`
      }
    </div>`;
  });
  h+=`</div></div>`;

  // ── STEP 3: confirm ──
  h+=`<div class="warn">⚠️ <span>Ao confirmar, a etapa fecha <strong>permanentemente</strong> — não pode ser alterada.</span></div>
  <div class="nav">
    <button class="btn btg" onclick="confirmResult()">🔒 Confirmar e fechar etapa ${s.num}</button>
  </div>`;

  el.innerHTML=h;
  // restore saved draft positions
  if(s._positions){
    S.players.forEach((p,i)=>{
      const inp=document.getElementById('pos'+i);
      if(inp&&s._positions[p])inp.value=s._positions[p];
    });
  }
  updatePosPreview();
}

function updatePosPreview(){
  // re-render pos-entries section live as winner name changes
  const pend=pendingStages();if(!pend.length)return;
  const s=pend[0];
  const winner=document.getElementById('winner-inp')?.value||'';
  RW=winner;
  S.players.forEach((p,i)=>{
    const b=s.bets&&s.bets[p];
    const jk=s.jokers&&s.jokers[p];
    const isWin=winner.trim()&&b&&b.trim().toLowerCase()===winner.trim().toLowerCase();
    const pe=document.getElementById('pe'+i);
    if(!pe)return;
    // save current pos input value before re-render
    const curPos=document.getElementById('pos'+i)?.value||'';
    const ptv=isWin?calcPts(1,true,jk):null;
    pe.innerHTML=`
      <div style="font-size:24px">${picon(i)}</div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:700">${p}${jk?' 🃏':''}</div>
        <div style="font-size:12px;color:var(--t2)">Apostou: <strong>${b||'—'}</strong></div>
      </div>
      ${isWin
        ?`<span class="win-badge">🏆 pos. 1</span>
          <span class="pts-preview" style="color:var(--gt)">${ptv} pts</span>`
        :`<input type="number" class="pos-input" id="pos${i}" min="1" max="200" placeholder="Pos."
            oninput="updatePts(${i})" value="${curPos}">
          <span class="pts-preview" id="pts${i}" style="color:var(--t2)">— pts</span>`
      }`;
    if(!isWin&&curPos)updatePts(i);
  });
}

function updatePts(i){
  const pend=pendingStages();if(!pend.length)return;
  const s=pend[0];
  const p=S.players[i];
  const b=s.bets&&s.bets[p];
  const jk=s.jokers&&s.jokers[p];
  const winner=document.getElementById('winner-inp')?.value||'';
  const pos=parseInt(document.getElementById('pos'+i)?.value);
  const el=document.getElementById('pts'+i);
  if(!el)return;
  if(isNaN(pos)||pos<1){el.textContent='— pts';el.style.color='var(--t2)';return}
  const isWin=winner.trim()&&b&&b.trim().toLowerCase()===winner.trim().toLowerCase();
  const ptv=calcPts(pos,isWin,jk);
  el.textContent=(ptv>=0?'+':'')+ptv+' pts';
  el.style.color=ptv<0?'var(--gt)':'#E24B4A';
  // save draft
  if(!s._positions)s._positions={};
  s._positions[p]=pos;
}

function confirmResult(){
  const pend=pendingStages();if(!pend.length)return;
  const stage=pend[0];
  const winner=(document.getElementById('winner-inp')?.value||RW).trim();
  if(!winner){alert('Indica o nome do vencedor da etapa.');return}

  // collect positions
  const positions={};
  const missing=[];
  S.players.forEach((p,i)=>{
    const b=stage.bets&&stage.bets[p];
    const isWin=b&&b.trim().toLowerCase()===winner.toLowerCase();
    if(isWin){positions[p]=1;return}
    const pos=parseInt(document.getElementById('pos'+i)?.value);
    if(isNaN(pos)||pos<1){missing.push(p);return}
    positions[p]=pos;
  });

  if(missing.length){alert('Falta a posição de: '+missing.join(', '));return}

  stage.winner=winner;
  stage.status='done';
  stage.positions=positions;
  delete stage._positions;
  delete stage._winner;
  sv();
  RW='';
  updateBadge();
  // show quick summary then go to LB
  rRes();rLB();
  go('lb');
}

/* ══════════════════════════════
   HISTÓRICO
══════════════════════════════ */
function rHist(){
  const el=document.getElementById('p-hist');
  const done=S.stages.filter(s=>s.status==='done').sort((a,b)=>a.num-b.num);
  if(!done.length){el.innerHTML='<div class="empty-state"><div class="big">📋</div>Ainda não há etapas concluídas</div>';return}
  let h=`<p class="seclab">✅ ${done.length} etapa${done.length!==1?'s':''} concluída${done.length!==1?'s':''}</p>`;
  done.forEach(s=>{
    const info=SI.find(x=>x.n===s.num)||{};
    h+=`<div style="margin-bottom:1.375rem">
      <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px">
        <span style="font-size:12px;color:var(--t2);font-weight:700">Et. ${s.num}</span>
        <span style="font-size:12px;color:var(--t2)">${info.d}</span>
        <span class="type-pill">${TI[info.t]||''} ${info.t}</span>
        <span style="font-size:14px;font-weight:800;flex:1">🏆 ${s.winner}</span>
      </div>
      <div style="font-size:12px;color:var(--t2);margin-bottom:6px">${info.r} · ${info.km}km</div>
      <div class="bet-row">`;
    S.players.forEach((p,i)=>{
      const b=s.bets&&s.bets[p],pos=s.positions&&s.positions[p];
      const w=b&&s.winner&&b.trim().toLowerCase()===s.winner.trim().toLowerCase();
      const jk=s.jokers&&s.jokers[p];
      const ptv=b&&pos!=null?calcPts(pos,w,jk):null;
      h+=`<div class="bc ${w?'bw':''}">
        <div class="bc-pn">${picon(i)} ${p}${jk?' 🃏':''}</div>
        <div class="bc-cy">${b||'—'}</div>
        ${ptv!=null?`<div class="bc-pt">${ptv>=0?'+':''}${ptv} pts</div>`:''}
      </div>`;
    });
    h+=`</div></div>`;
  });
  el.innerHTML=h;
}

/* ══════════════════════════════
   CONFIG
══════════════════════════════ */
function rCfg(){
  let h=`<div class="card"><div class="card-title">Jogadores e ícones</div>`;
  S.players.forEach((p,i)=>{
    h+=`<div class="pl-row">
      <select id="ic${i}" onchange="S.icons[${i}]=this.value;sv()">${ALL_ICONS.map(ic=>`<option value="${ic}" ${ic===picon(i)?'selected':''}>${ic}</option>`).join('')}</select>
      <input type="text" value="${p}" id="pl${i}">
      <button class="btn btgh btsm" onclick="rmP(${i})">🗑</button>
    </div>`;
  });
  h+=`<div class="nav" style="margin-top:8px">
    <button class="btn btgh btsm" onclick="addP()">+ Adicionar</button>
    <button class="btn bty btsm" onclick="saveP()">✓ Guardar</button>
  </div></div>
  <div class="card" style="border-color:var(--rbd)"><div class="card-title" style="color:var(--rt)">Zona de perigo</div>
  <p style="font-size:13px;color:var(--t2);margin-bottom:12px">Apaga todos os dados guardados</p>
  <button class="btn btdanger" onclick="resetAll()">🗑 Apagar tudo</button></div>`;
  document.getElementById('p-cfg').innerHTML=h;
}

function addP(){saveP();S.players.push('Novo');S.icons.push(ALL_ICONS[S.players.length%ALL_ICONS.length]);sv();rCfg()}
function rmP(i){if(S.players.length<=1)return;if(!confirm('Remover '+S.players[i]+'?'))return;S.players.splice(i,1);S.icons.splice(i,1);sv();rCfg()}
function saveP(){
  S.players=S.players.map((_,i)=>document.getElementById('pl'+i)?.value.trim()||S.players[i]);
  S.icons=S.players.map((_,i)=>document.getElementById('ic'+i)?.value||S.icons[i]);
  sv();
}
function resetAll(){if(!confirm('Apagar TUDO?'))return;const pl=S.players,ic=S.icons;S=JSON.parse(JSON.stringify(DEF));S.players=pl;S.icons=ic;sv();W={step:0,stageNum:null,bets:{},jokers:{},locked:{}};RW='';updateBadge();go('lb')}

updateBadge();rLB();
</script>
</body>
</html>
